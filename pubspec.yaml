name: appiosandroid
description: "PrestaRD - App de Préstamos y Cobranza"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Local storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4

  # UI & animations
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.2
  flutter_slidable: ^4.0.0
  flutter_speed_dial: ^7.0.0

  # Camera & permissions
  camera: ^0.11.1
  image_picker: ^1.2.3
  permission_handler: ^11.4.0

  # Signature & biometrics
  signature: ^5.5.0
  local_auth: ^3.0.2

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  get_it: ^8.0.3

  # PDF generation
  pdf: ^3.11.3
  printing: ^5.13.3

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
